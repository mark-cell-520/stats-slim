name: release

# 上游的 release.yaml 需要 Apple 开发者证书、公证账号和 DMG 制作工具，分叉拿不到这些
# 密钥，所以改成「构建 + 打 zip + 发布」。产物不签名不公证，用户在 README 里能看到
# 首次打开的处理方法。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        # 上游的 release.yaml 靠 "Developer ID Application" 证书与公证密钥，分叉没有这些
        # 凭据，产物按 README 说明的不签名发布，所以把签名关掉。
        # 这两个设置必须作为 xcodebuild 的命令行参数，不能挪到 env: 里——Xcode 不把这两个
        # 环境变量当构建设置覆盖用，日志里看不到 "CODE_SIGN_IDENTITY =" 那一行，签名照旧
        # 要找 "Developer ID Application"，然后在 WidgetsExtension / LaunchAtLogin / SMC /
        # Helper / Stats 五个目标上报 "No signing certificate ... matching team ID
        # RP2S87B72W"。
        # 编出来的是通用二进制（x86_64 + arm64），与 Releases 里已发布的产物一致。
        run: |
          xcodebuild -project Stats.xcodeproj -scheme Stats -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: Verify app and widget versions match
        run: |
          app=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
            build/Build/Products/Release/Stats.app/Contents/Info.plist)
          widget=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \
            build/Build/Products/Release/Stats.app/Contents/PlugIns/WidgetsExtension.appex/Contents/Info.plist)
          echo "app: $app, widget: $widget"
          [ "$app" = "$widget" ] || { echo "ERROR: widget version does not match app"; exit 1; }

      - name: Zip
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Stats.app Stats.zip
          shasum -a 256 Stats.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/Stats.zip
          body: |
            未签名的构建产物。首次打开前执行 `xattr -cr /Applications/Stats.app`，
            或在访达里按住 Control 点图标选「打开」。详见仓库 README 的「安装」一节。
