disabled_rules:
  - force_cast # todo
  - type_name # todo
  - cyclomatic_complexity # todo
  - trailing_whitespace
  - opening_brace
  - implicit_getter
  - implicit_optional_initialization
  - large_tuple
  - function_body_length

opt_in_rules:
  - control_statement
  - empty_count
  - trailing_newline
  - colon
  - comma

identifier_name:
  min_length: 1
  excluded:
    - AppUpdateIntervals
    - TemperatureUnits
    - SpeedBase
    - SensorsWidgetMode
    - SpeedPictogram
    - BatteryAdditionals
    - ShortLong
    - ReaderUpdateIntervals
    - NumbersOfProcesses
    - NetworkReaders
    - SensorsList
    - Alignments
    - _devices
    - _uuidAddress
    - AppleSiliconSensorsList
    - FanValues
    - CombinedModulesSpacings
    - BatteryInfo
    - PublicIPAddressRefreshIntervals
    - _values
    - _writeTS
    - LineChartHistory
    - SpeedPictogramColor
    - SensorsWidgetValue
    - access_token
    - refresh_token
    - device_code
    - user_code
    - verification_uri_complete
    - expires_in
    - NetworkSpeedUnitAuto
    - NetworkSpeedUnits
    # 桌面组件的 kind 常量（各模块 main.swift 里那个 internal let）。SwiftLint 的
    # identifier_name 只拦「首字母大写 + 第二个字母小写」，同组的 CPUWidgetKind /
    # GPUWidgetKind / RAMWidgetKind 第二个字母是大写，被当成缩写词放行，不会报。
    - DiskWidgetKind
    - NetWidgetKind

line_length: 200

type_body_length:
  - 700
  - 1000

file_length:
  - 1400
  - 1800
